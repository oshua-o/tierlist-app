<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Feldbuch – Wildtiere Deutschland</title>
<meta name="description" content="Fotografiere alle heimischen Wildtiere Deutschlands und verfolge deinen Fortschritt." />

<!-- iOS Home-Screen / PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Feldbuch" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="theme-color" content="#240d58" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#240d58;
    --ink-soft:#4a3a72;
    --paper:#faf6ee;
    --paper-card:#fffdf8;
    --line:#e7ded0;
    --stamp-green:#2e6b3e;
    --shadow:0 2px 10px rgba(36,13,88,.08);
    --shadow-lift:0 10px 28px rgba(36,13,88,.18);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(ellipse at top left, rgba(36,13,88,.04), transparent 55%),
      repeating-linear-gradient(180deg, rgba(36,13,88,.025) 0 1px, transparent 1px 34px);
    color:var(--ink);
    font-family:'Inter', -apple-system, system-ui, sans-serif;
    min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-tap-highlight-color: transparent;
  }

  header.top{
    padding:calc(1.6rem + env(safe-area-inset-top)) 1.1rem 1rem;
    max-width:900px;
    margin:0 auto;
  }
  .eyebrow{
    font-size:.7rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:600;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.9rem;
    margin:.2rem 0 .3rem;
    line-height:1.05;
  }
  .subtitle{
    font-size:.85rem;
    color:var(--ink-soft);
    margin:0 0 1rem;
    max-width:46ch;
  }

  /* progress strip — signature element: a taped field-journal ribbon */
  .progress-wrap{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:.7rem;
    padding:.85rem 1rem;
    box-shadow:var(--shadow);
    position:relative;
  }
  .progress-wrap::before{
    content:"";
    position:absolute;
    top:-8px; left:1.2rem;
    width:46px; height:16px;
    background:rgba(36,13,88,.10);
    transform:rotate(-2deg);
    border-radius:2px;
  }
  .progress-row{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:.8rem; margin-bottom:.4rem;
  }
  .progress-row strong{
    font-family:'Fraunces', serif;
    font-size:1.15rem;
    font-weight:600;
  }
  .progress-track{
    height:8px; background:#efe8d9; border-radius:99px; overflow:hidden;
  }
  .progress-fill{
    height:100%; background:linear-gradient(90deg, var(--ink), #4a2f8f);
    border-radius:99px; transition:width .5s ease;
  }

  .search-row{
    display:flex; gap:.5rem; margin:1rem 0 .2rem;
  }
  .search-row input{
    flex:1;
    font-family:inherit;
    font-size:.9rem;
    padding:.6rem .8rem;
    border-radius:.6rem;
    border:1px solid var(--line);
    background:var(--paper-card);
    color:var(--ink);
  }
  .search-row input::placeholder{ color:#a79bc4; }
  .filter-btn{
    font-family:inherit; font-size:.78rem; font-weight:600;
    border:1px solid var(--line); background:var(--paper-card);
    color:var(--ink-soft); border-radius:.6rem; padding:.5rem .7rem;
    white-space:nowrap;
  }
  .filter-btn[aria-pressed="true"]{
    background:var(--ink); color:var(--paper-card); border-color:var(--ink);
  }

  main{ max-width:900px; margin:0 auto; padding:0 1.1rem 3rem; }

  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:.7rem;
    margin-top:1.1rem;
  }
  @media (max-width:520px){ .grid{ grid-template-columns:repeat(2,1fr);} }
  @media (min-width:760px){ .grid{ grid-template-columns:repeat(4,1fr);} }

  .card{
    position:relative;
    aspect-ratio:1/1.08;
    border-radius:.6rem;
    overflow:hidden;
    background:var(--paper-card);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:active{ transform:scale(.96); }

  .card.empty{
    flex-direction:column; gap:.35rem;
    padding:.5rem;
    border-style:dashed;
    border-color:#cfc4e6;
  }
  .card.empty .cam{
    width:1.35rem; height:1.35rem; opacity:.55;
  }
  .card.empty .name{
    font-family:'Fraunces', serif;
    font-size:.72rem; line-height:1.15;
    text-align:center;
    color:var(--ink-soft);
  }
  .card.empty .sci{
    font-size:.56rem; font-style:italic; color:#a79bc4;
    text-align:center;
  }

  .card.filled img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .card.filled .caption{
    position:absolute; left:0; right:0; bottom:0;
    background:linear-gradient(0deg, rgba(36,13,88,.82), transparent);
    color:#fff; font-family:'Fraunces', serif; font-size:.65rem;
    padding:.9rem .4rem .35rem; text-align:center; line-height:1.15;
  }
  /* signature: little rubber stamp badge on completed tiles */
  .stamp{
    position:absolute; top:.35rem; right:.35rem;
    width:1.5rem; height:1.5rem; border-radius:50%;
    background:rgba(250,246,238,.92);
    border:1.5px solid var(--stamp-green);
    color:var(--stamp-green);
    display:flex; align-items:center; justify-content:center;
    font-size:.8rem; font-weight:700;
    transform:rotate(-8deg);
    box-shadow:0 1px 4px rgba(0,0,0,.2);
  }

  .empty-msg{
    grid-column:1/-1; text-align:center; padding:2.5rem 1rem;
    color:var(--ink-soft); font-style:italic; font-family:'Fraunces', serif;
  }

  /* ---------- Sheets / Modals ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(20,10,40,.55);
    backdrop-filter:blur(2px);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50; opacity:0; pointer-events:none;
    transition:opacity .2s ease;
  }
  .sheet-backdrop.open{ opacity:1; pointer-events:auto; }
  .sheet{
    background:var(--paper);
    width:100%; max-width:520px;
    border-radius:1.2rem 1.2rem 0 0;
    padding:1.1rem 1.1rem calc(1.6rem + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .25s cubic-bezier(.32,.72,0,1);
    max-height:88vh; overflow-y:auto;
  }
  .sheet-backdrop.open .sheet{ transform:translateY(0); }
  .sheet-handle{
    width:36px; height:4px; background:var(--line); border-radius:99px;
    margin:0 auto .9rem;
  }
  .sheet h2{
    font-family:'Fraunces', serif; font-weight:600; font-size:1.3rem; margin:0 0 .1rem;
  }
  .sheet .sci{ font-style:italic; color:var(--ink-soft); font-size:.85rem; margin-bottom:1rem; }

  .capture-options{ display:flex; flex-direction:column; gap:.6rem; margin-top:.5rem; }
  .capture-btn{
    display:flex; align-items:center; gap:.7rem;
    font-family:'Inter'; font-size:.95rem; font-weight:600;
    background:var(--paper-card); border:1px solid var(--line);
    border-radius:.7rem; padding:.85rem 1rem; color:var(--ink);
    cursor:pointer;
  }
  .capture-btn svg{ flex-shrink:0; }
  .capture-btn:active{ background:#f1ebe0; }
  .cancel-btn{
    margin-top:.9rem; width:100%; text-align:center;
    background:none; border:none; color:var(--ink-soft);
    font-family:'Inter'; font-size:.9rem; padding:.6rem;
  }

  /* zoom / detail sheet */
  .zoom-photo{
    width:100%; aspect-ratio:1; object-fit:cover;
    border-radius:.8rem; box-shadow:var(--shadow-lift);
  }
  .zoom-meta{
    display:flex; justify-content:space-between; align-items:flex-start;
    margin-top:.9rem;
  }
  .zoom-date{ font-size:.78rem; color:var(--ink-soft); margin-top:.15rem;}
  .trash-btn{
    border:1px solid #e3c9c9; background:#fff6f6; color:#a53a3a;
    border-radius:.6rem; padding:.5rem .6rem; cursor:pointer;
    display:flex; align-items:center; gap:.35rem; font-size:.78rem; font-weight:600;
  }
  .trash-btn:active{ background:#fbe6e6; }

  #camInput, #libInput{ display:none; }

  .toast{
    position:fixed; left:50%; bottom:calc(1.3rem + env(safe-area-inset-bottom));
    transform:translate(-50%, 10px);
    background:var(--ink); color:#fff; font-size:.82rem;
    padding:.6rem 1rem; border-radius:99px; box-shadow:var(--shadow-lift);
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    z-index:60;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>

  <header class="top">
    <div class="eyebrow">Mein Feldbuch</div>
    <h1>Wildtiere Deutschlands</h1>
    <p class="subtitle">387 heimische Vögel, Säugetiere, Reptilien &amp; Amphibien. Tippe eine leere Kachel an, um ein Foto hinzuzufügen.</p>

    <div class="progress-wrap">
      <div class="progress-row">
        <span>fotografiert</span>
        <strong id="statText">0 / 387</strong>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>

    <div class="search-row">
      <input id="searchInput" type="search" placeholder="Art suchen…" autocomplete="off" />
      <button class="filter-btn" id="filterBtn" aria-pressed="false">nur offen</button>
    </div>
  </header>

  <main>
    <div class="grid" id="grid"></div>
  </main>

  <!-- Capture sheet -->
  <div class="sheet-backdrop" id="captureBackdrop">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h2 id="captureName"></h2>
      <div class="sci" id="captureSci"></div>
      <div class="capture-options">
        <button class="capture-btn" id="btnCamera">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z" stroke="#240d58" stroke-width="1.6"/><circle cx="12" cy="13" r="3.4" stroke="#240d58" stroke-width="1.6"/></svg>
          Foto aufnehmen
        </button>
        <button class="capture-btn" id="btnLibrary">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4.5" width="17" height="15" rx="2" stroke="#240d58" stroke-width="1.6"/><path d="M3.5 15.5 8 11l3 3 4-4.5 5.5 6" stroke="#240d58" stroke-width="1.6" stroke-linejoin="round"/><circle cx="8" cy="8.5" r="1.4" fill="#240d58"/></svg>
          Aus Fotomediathek wählen
        </button>
      </div>
      <button class="cancel-btn" id="cancelCapture">Abbrechen</button>
    </div>
  </div>

  <!-- Zoom sheet -->
  <div class="sheet-backdrop" id="zoomBackdrop">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <img class="zoom-photo" id="zoomPhoto" alt="" />
      <div class="zoom-meta">
        <div>
          <h2 id="zoomName" style="margin-bottom:.1rem;"></h2>
          <div class="sci" id="zoomSci" style="margin-bottom:.2rem;"></div>
          <div class="zoom-date" id="zoomDate"></div>
        </div>
        <button class="trash-btn" id="deleteBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-9 0 1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13" stroke="#a53a3a" stroke-width="1.7" stroke-linecap="round"/></svg>
          Löschen
        </button>
      </div>
      <button class="cancel-btn" id="closeZoom">Schließen</button>
    </div>
  </div>

  <input type="file" id="camInput" accept="image/*" capture="environment" />
  <input type="file" id="libInput" accept="image/*" />

  <div class="toast" id="toast"></div>

  <script src="species.js"></script>
  <script src="app.js"></script>
</body>
</html>
